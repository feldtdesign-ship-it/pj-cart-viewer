<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* Phone first. The cart fills the screen. One small card at the bottom shows one part at a time, with arrows.
   "All parts" opens the whole numbered list. */
:root{
  --paper:#ffffff; --stage:#e6e6e2; --ink:#15151b; --ink-soft:#50505c; --rule:#15151b; --yellow:#ffd400; --yellow-wash:#fff4b8;
  --hand:'Sedgwick Ave Display','Marker Felt',cursive; --sans:'Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#cfcfca;color:var(--ink);font:400 16px/1.45 var(--sans)}
button{font:inherit;color:inherit}

.app{position:relative;display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:var(--paper);box-shadow:0 0 0 2px var(--rule)}

/* ---------- the cart ---------- */
.stage{position:relative;flex:1 1 auto;min-height:0;background:var(--stage);overflow:hidden}
model-viewer{position:absolute;inset:0;width:100%;height:100%;--poster-color:transparent;--progress-bar-color:transparent;
  background:radial-gradient(ellipse at 50% 72%,#f4f4f1 0%,#e6e6e2 55%,#d3d3ce 100%);outline:none}
model-viewer::part(default-ar-button){display:none}
.brand{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:3;display:flex;align-items:center;gap:10px;pointer-events:none}
.brand img{height:30px;width:auto;background:var(--ink);padding:4px 9px;border-radius:7px}
.brand span{font:400 26px/1 var(--hand);text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff}
.tools{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:4;display:flex;flex-direction:row;gap:6px}
.tbtn{min-width:48px;min-height:44px;padding:0 10px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;cursor:pointer;touch-action:manipulation;
  font:700 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase}
.tbtn[aria-pressed="true"]{background:var(--yellow)}
.tbtn:active{background:var(--yellow-wash)}

.loading{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;transition:opacity .5s;background:rgba(230,230,226,.55)}
.loading.done{opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
.ld-title{font:400 clamp(26px,7vw,40px)/1 var(--hand)}
.ld-bar{width:min(280px,64%);height:16px;border:2px solid var(--ink);border-radius:9px;background:var(--paper);overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--yellow);border-right:2px solid var(--ink);transition:width .25s}
.ld-pct{font:700 14px/1.3 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* callouts: the numbers sit in the margins with a thin line to the part, like an instruction sheet. The hotspot itself is invisible. */
.pin{display:block;position:relative;width:0;height:0;padding:0;margin:0;border:0;background:none;pointer-events:none}
.callouts{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
.callouts .ln{stroke:var(--ink);stroke-width:1.5}
.callouts .dot{fill:var(--yellow);stroke:var(--ink);stroke-width:2}
.callouts .bd{pointer-events:auto;cursor:pointer}
.callouts .bd circle{fill:var(--yellow);stroke:var(--ink);stroke-width:2}
.callouts .bd text{font:700 13px var(--sans);fill:var(--ink)}
.callouts .on .bd circle{fill:var(--ink);stroke:var(--yellow);stroke-width:2.5}
.callouts .on .bd text{fill:var(--yellow)}
.callouts .on .ln{stroke-width:2.5}
.stage.no-pins .callouts{display:none}
@media (max-width:430px){.brand span{display:none}}

/* ---------- the one-part card ---------- */
.sheet{flex:0 0 auto;border-top:2px solid var(--rule);background:var(--paper);padding:12px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.card{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;min-height:104px}
.num{width:42px;height:42px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;font:700 17px/1 var(--sans);font-variant-numeric:tabular-nums}
.card h2{margin:0;font:400 clamp(28px,7.4vw,36px)/1 var(--hand)}
.card p{margin:6px 0 0;color:var(--ink-soft);font-size:15px;line-height:1.4}
.nav{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;margin-top:10px}
.btn{min-height:48px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;cursor:pointer;touch-action:manipulation;font:700 13px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.btn.arrow{font-size:22px}
.btn.main{background:var(--yellow)}
.btn:active{background:var(--yellow-wash)}
.btn:focus-visible,.tbtn:focus-visible,.item:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- all parts (opens over everything) ---------- */
.all{position:absolute;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s ease;visibility:hidden}
.all.open{transform:none;visibility:visible}
.all-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));border-bottom:2px solid var(--rule)}
.all-head h2{margin:0;font:400 34px/1 var(--hand)}
.all-body{flex:1 1 auto;overflow:auto;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.glance{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--rule);margin:16px 0 4px}
.glance div{padding:9px 11px;border-right:2px solid var(--rule);border-bottom:2px solid var(--rule);margin:-1px -1px 0 0}
.glance dt{font:600 10px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.glance dd{margin:3px 0 0;font:700 15px/1.2 var(--sans)}
.grp{margin:24px 0 0;padding-bottom:8px;border-bottom:2px solid var(--rule);font:700 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between}
.grp span{color:var(--ink-soft);font-weight:600}
.item{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;width:100%;text-align:left;padding:12px 4px;background:none;border:0;border-bottom:1px solid #c9c9c3;cursor:pointer}
.item .num{width:34px;height:34px;font-size:14px}
.item h3{margin:0;font:400 26px/1.05 var(--hand)}
.item p{margin:3px 0 0;color:var(--ink-soft);font-size:14px}
.item[aria-current="true"]{background:var(--yellow-wash)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <section class="stage" id="stage" aria-label="3D model of the cart">
    <model-viewer id="v" src="cart.glb" poster="poster.jpg" reveal="auto" loading="eager" alt="PJ's cart. Drag to turn it, pinch to zoom."
      camera-controls touch-action="none" interaction-prompt="none"
      auto-rotate auto-rotate-delay="3500" rotation-per-second="12deg"
      camera-orbit="38deg 78deg auto" min-camera-orbit="auto 4deg 0.6m" max-camera-orbit="auto 106deg 7m"
      field-of-view="30deg" interpolation-decay="70" exposure="1.0" shadow-intensity="1.1" shadow-softness="0.9"
      environment-image="neutral"></model-viewer>
    <svg class="callouts" id="callouts" role="group" aria-label="Numbered parts"></svg>
    <div class="brand"><img src="signature.png" alt="PJ O'Rourke"><span>The Cart</span></div>
    <div class="tools">
      <button class="tbtn" id="bPins" aria-pressed="true">Nums</button>
      <button class="tbtn" id="bSpin" aria-pressed="true">Spin</button>
      <button class="tbtn" id="bReset">Reset</button>
    </div>
    <div class="loading" id="loading" role="status" aria-live="polite">
      <div class="ld-title" id="ldTitle">Loading the cart…</div>
      <div class="ld-bar" aria-hidden="true"><i id="ldFill"></i></div>
      <div class="ld-pct" id="ldPct">0%</div>
    </div>
  </section>

  <section class="sheet" aria-label="Part description">
    <div class="card" aria-live="polite">
      <span class="num" id="cNum">★</span>
      <div><h2 id="cName">The Cart</h2><p id="cText">Drag to spin it. Tap a yellow number, or use the arrows, to see each part.</p></div>
    </div>
    <div class="nav">
      <button class="btn arrow" id="prev" aria-label="Previous part">‹</button>
      <button class="btn main" id="bAll">All parts · <span id="cCount">20</span></button>
      <button class="btn arrow" id="next" aria-label="Next part">›</button>
    </div>
  </section>

  <section class="all" id="all" aria-label="All parts">
    <div class="all-head"><h2>All parts</h2><button class="btn" id="closeAll" style="min-width:84px">Close</button></div>
    <div class="all-body">
      <dl class="glance">
        <div><dt>Height with lamp</dt><dd>6 ft 5 in</dd></div>
        <div><dt>Cabinet</dt><dd>17 × 14 × 63 in</dd></div>
        <div><dt>Basket inside</dt><dd>18 × 15 × 16 in</dd></div>
        <div><dt>You push from</dt><dd>the back</dd></div>
      </dl>
      <div id="list"></div>
    </div>
  </section>
</div>

<script>
const V=document.getElementById('v'), stage=document.getElementById('stage'), IN=0.0254;
/* id, group, name, explanation, position in inches (cart coordinates: +X front, -X handle end, +Y long side, -Y iPad side, Z up), outward normal, how close to fly (m) */
const GROUPS=['On top','Outside','The frame','Inside'];
const ITEMS=[
 ['lamp','On top','Barricade lamp','Battery-style barricade lamp on the very top. The amber lens flashes about once a second, like a roadwork light.',[1.0,0,74.3],[1,0,0.2],0.8],
 ['logo','On top','3D printed logo','PJ’s signature, printed as a raised shape about a third of an inch thick. It sits at the top of the front, the end away from the handle.',[9.9,0,63.9],[1,0,0],0.85],
 ['gallery','Outside','Gallery wall','Twelve 5×7 prints in thin black frames, art edge to edge with no mat. Six on the long side, four on the front, two on the iPad side.',[1.0,7.2,54.5],[0,1,0],1.6],
 ['ipad','Outside','iPad','An iPad Pro 13 slides into a black frame that is open at the top. It plays the vertical New York Fuckery loop all day.',[1.0,-7.4,50.0],[0,-1,0],0.8],
 ['cord','Outside','Charge cord','A short USB-C cord goes through a grommet in the wall and plugs into the iPad’s charging port.',[1.0,-7.2,43.8],[0,-1,0],0.5],
 ['tags','Outside','Price tags','Small white tags on every patch and on a few prints. Patches are $20 to $40, prints are $50, the same as on the shop.',[-0.5,8.4,13.7],[0,1,0],0.65],
 ['patches','Outside','Sew-on patches','Fourteen small sew-on patches, 2.5 to 5 inches wide, in three clusters on the black panels.',[1.1,-8.3,16.3],[0,-1,0],0.85],
 ['black','Outside','Black paint','Black panels on the front and both sides sit outside the wire, so the cross bars disappear. The diagonal handle tubes stay in front.',[4.0,8.25,20.0],[0,1,0],0.9],
 ['yellow','Outside','Safety yellow','A 3-inch band of signature safety yellow runs along the bottom of every side.',[10.8,0,8.1],[1,0,0],0.75],
 ['backlogo','Outside','Yellow logo','A second logo in yellow on the black panel at the handle end.',[-9.0,0,15.8],[-1,0,0],0.75],
 ['basket','The frame','Wire basket','The cart’s steel wire basket holds the cabinet. It is 18 × 15 × 16 inches inside.',[1.0,-8.4,22.6],[0,-1,0.1],0.85],
 ['cabinet','The frame','Plywood cabinet','White painted plywood, 17 × 14 × 63 inches, open on one end and raw plywood inside.',[9.7,0,40.0],[1,0,0],1.2],
 ['handle','The frame','Push handle','You push from the back. The padded grip is 40 inches up, and the diagonal tubes carry it down to the casters.',[-12.9,0,40.0],[-1,0,0],1.0],
 ['wheels','The frame','Big wheels','Two 8-inch wheels at the handle end. Tip the cart back and it rolls on these.',[-8.5,-10.8,4.0],[0,-1,0],0.75],
 ['casters','The frame','Swivel casters','Two 3.5-inch swivel casters at the front end do the steering.',[8.5,-8.7,1.7],[0,-1,0],0.65],
 ['cubbies','Inside','Folded tees','Three open shelves for folded tees. The shelf just under the power bank is left empty.',[-7.0,0,57.0],[-1,0,0],0.95],
 ['hook','Inside','Coat hook','A black single hook near the top inside, for a cap or a tote.',[-4.5,6.0,66.6],[-1,-0.6,0],0.55,[-48,84]],
 ['leds','Inside','Yellow LED strips','Yellow LEDs under each shelf and up both edges of the opening light the inside.',[-7.0,0,54.0],[-1,0,0],0.9,[-24,78]],
 ['power','Inside','Power bank','A 20,000 mAh power bank sits on a small shelf with a strap. Its built-in cord feeds the iPad.',[0.0,-5.6,37.1],[-1,0.6,0],0.75,[-112,95]],
 ['pit','Inside','Open storage pit','An open pit at the bottom for anything bulky. Its back wall is level with the top of the basket.',[-4.0,0,16.0],[-1,0,1],0.95,[-125,28]]
];
/* how big each part looks from its close-up angle (inches across, up): the camera distance is worked out from this and the screen shape, so every part fills about 60% of the view and sits centered */
const SIZE={lamp:[6,8],logo:[12,5],gallery:[14,26],ipad:[11,13],cord:[4,4],tags:[14,12],patches:[14,12],black:[20,14],yellow:[18,4],backlogo:[13,8],
  basket:[18,10],cabinet:[18,50],handle:[16,12],wheels:[10,10],casters:[6,6],cubbies:[14,22],hook:[4,4],leds:[14,10],power:[6,8],pit:[16,14]};
function flyRadius(id,fallback){
  const s=SIZE[id]; if(!s) return fallback;
  const asp=Math.max(0.3,stage.clientWidth/Math.max(1,stage.clientHeight)), tan=Math.tan(15*Math.PI/180);   // field of view is 30 degrees, vertical
  const inches=Math.max(s[1]/0.6, s[0]/(0.6*asp));
  return Math.max(0.6, inches*IN/(2*tan));
}
const glt=(p)=>[p[0]*IN,p[2]*IN,-p[1]*IN];            // cart inches (x,y,z up) -> glTF metres (x, y up, -z)
const pins={}, rows={};
document.getElementById('cCount').textContent=ITEMS.length;

/* the full list */
const listEl=document.getElementById('list');
GROUPS.forEach(g=>{
  const items=ITEMS.filter(i=>i[1]===g);
  const h=document.createElement('div'); h.className='grp'; h.innerHTML=g+'<span>'+items.length+' parts</span>'; listEl.appendChild(h);
  items.forEach(it=>{
    const n=ITEMS.indexOf(it)+1, b=document.createElement('button'); b.className='item'; b.type='button';
    b.innerHTML='<span class="num">'+n+'</span><span><h3>'+it[2]+'</h3><p>'+it[3]+'</p></span>';
    b.addEventListener('click',()=>{closeAll();select(it[0],true)}); listEl.appendChild(b); rows[it[0]]=b;
  });
});

/* numbered pins on the cart */
ITEMS.forEach((it,i)=>{
  const b=document.createElement('button'); b.className='pin'; b.slot='hotspot-'+it[0]; b.type='button';
  b.dataset.visibilityAttribute='visible'; b.setAttribute('aria-label','Part '+(i+1)+': '+it[2]);
  b.dataset.position=glt(it[4]).map(v=>v.toFixed(4)+'m').join(' ');
  const nm=it[5]; b.dataset.normal=nm[0]+' '+nm[2]+' '+(-nm[1]);
  V.appendChild(b); pins[it[0]]=b;
});

/* one part at a time: update the card, light the pin, fly the camera in head-on */
let cur=-1;
const HOME={orbit:'38deg 78deg auto',target:'auto auto auto',fov:'30deg'};
function select(id,fly){
  const idx=ITEMS.findIndex(i=>i[0]===id); if(idx<0) return; cur=idx; const it=ITEMS[idx];
  document.getElementById('cNum').textContent=idx+1; document.getElementById('cName').textContent=it[2]; document.getElementById('cText').textContent=it[3];
  Object.values(pins).forEach(p=>p.classList.remove('on')); pins[id].classList.add('on');
  Object.values(rows).forEach(r=>r.removeAttribute('aria-current')); rows[id].setAttribute('aria-current','true');
  if(fly){
    const n=it[5]; let theta=Math.atan2(n[0],-n[1])*180/Math.PI;
    let phi=Math.max(58,Math.min(98,90-Math.atan2(n[2],Math.hypot(n[0],n[1]))*180/Math.PI*0.6));
    if(it[7]){theta=it[7][0];phi=it[7][1]}                            // a few inside parts need a set angle through the open end
    V.autoRotate=false; setPressed('bSpin',false);
    V.cameraTarget=glt(it[4]).map(v=>v.toFixed(4)+'m').join(' ');
    V.cameraOrbit=theta.toFixed(1)+'deg '+phi.toFixed(1)+'deg '+flyRadius(id,it[6]*1.5).toFixed(2)+'m';
  }
}
function reset(){
  cur=-1; document.getElementById('cNum').textContent='★'; document.getElementById('cName').textContent='The Cart';
  document.getElementById('cText').textContent='Drag to spin it. Tap a yellow number, or use the arrows, to see each part.';
  Object.values(pins).forEach(p=>p.classList.remove('on')); Object.values(rows).forEach(r=>r.removeAttribute('aria-current'));
  V.cameraTarget=HOME.target; V.cameraOrbit=HOME.orbit; V.fieldOfView=HOME.fov;
}

/* callouts: a dot on the part, a thin line, and the number out in the left or right margin. Redrawn every frame so it follows the spin. */
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('callouts'), G={};
ITEMS.forEach((it,i)=>{
  const g=document.createElementNS(NS,'g'); g.style.display='none';
  g.innerHTML='<line class="ln"/><circle class="dot" r="4.5"/><g class="bd"><circle r="14"/><text dy="0.35em" text-anchor="middle">'+(i+1)+'</text></g>';
  g.querySelector('.bd').addEventListener('click',()=>select(it[0],true));
  svg.appendChild(g); G[it[0]]={g,ln:g.querySelector('.ln'),dot:g.querySelector('.dot'),bd:g.querySelector('.bd')};
});
function drawCallouts(){
  const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h||stage.classList.contains('no-pins')) return;
  const vis=[];
  ITEMS.forEach(it=>{
    G[it[0]].g.style.display='none';
    const q=V.queryHotspot&&V.queryHotspot('hotspot-'+it[0]);
    const isSel=cur>=0&&ITEMS[cur][0]===it[0];
    if(cur>=0&&!isSel) return;                                          // zoomed in on one part: show only its callout
    if((isSel||pins[it[0]].hasAttribute('data-visible'))&&q&&q.canvasPosition) vis.push({id:it[0],x:q.canvasPosition.x,y:q.canvasPosition.y});
  });
  [true,false].forEach(left=>{
    const arr=vis.filter(p=>(p.x<w/2)===left).sort((a,b)=>a.y-b.y);
    let last=-1e9; arr.forEach(p=>{p.by=Math.max(p.y,last+34,66); last=p.by});
    let top=h-18; for(let i=arr.length-1;i>=0;i--){ if(arr[i].by>top) arr[i].by=top; top=arr[i].by-34; }
    arr.forEach(p=>{
      const o=G[p.id], bx=left?22:w-22; o.g.style.display='';
      o.ln.setAttribute('x1',p.x); o.ln.setAttribute('y1',p.y); o.ln.setAttribute('x2',bx); o.ln.setAttribute('y2',p.by);
      o.dot.setAttribute('cx',p.x); o.dot.setAttribute('cy',p.y); o.bd.setAttribute('transform','translate('+bx+','+p.by+')');
      o.g.classList.toggle('on',cur>=0&&ITEMS[cur][0]===p.id);
    });
  });
}
(function tick(){drawCallouts();requestAnimationFrame(tick)})();

/* buttons */
function setPressed(id,on){document.getElementById(id).setAttribute('aria-pressed',on)}
document.getElementById('prev').onclick=()=>select(ITEMS[(cur<=0?ITEMS.length:cur)-1][0],true);
document.getElementById('next').onclick=()=>select(ITEMS[(cur+1)%ITEMS.length][0],true);
document.getElementById('bPins').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';setPressed('bPins',on);stage.classList.toggle('no-pins',!on)};
document.getElementById('bSpin').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';setPressed('bSpin',on);V.autoRotate=on;if(on&&cur>=0)reset()};
document.getElementById('bReset').onclick=()=>{reset();V.autoRotate=true;setPressed('bSpin',true)};
const all=document.getElementById('all');
function openAll(){all.classList.add('open')} function closeAll(){all.classList.remove('open')}
document.getElementById('bAll').onclick=openAll; document.getElementById('closeAll').onclick=closeAll;
V.addEventListener('camera-change',e=>{if(e.detail&&e.detail.source==='user-interaction'){setPressed('bSpin',false)}});

/* loading progress, and an on-screen message if the model can't start */
function loadProblem(msg){
  document.getElementById('ldTitle').textContent='The 3D model did not start';
  const p=document.getElementById('ldPct'); p.textContent=msg; p.style.whiteSpace='normal'; p.style.textAlign='center'; p.style.maxWidth='88%';
  document.getElementById('loading').classList.remove('done');
}
V.addEventListener('progress',e=>{
  const p=Math.max(0,Math.min(1,e.detail.totalProgress||0)), pct=Math.round(p*100);
  document.getElementById('ldFill').style.width=pct+'%';
  document.getElementById('ldPct').textContent=pct<100?pct+'%':'Setting it up…';
  if(pct>=100) document.getElementById('ldTitle').textContent='Almost there…';
});
V.addEventListener('error',e=>{const d=e.detail||{}; loadProblem('Error: '+(d.sourceError&&d.sourceError.message||d.message||d.type||'unknown'))});
setTimeout(()=>{if(!V.loaded) loadProblem('Still loading after 45 seconds. Check your connection, then reload.')},45000);

V.addEventListener('load',()=>{
  document.getElementById('loading').classList.add('done');
  /* iPad plays the New York Fuckery loop; the lamp flashes like a real barricade light */
  const mats=V.model.materials, byName=n=>mats.find(x=>x.name===n);
  const screen=byName('iPadScreen');
  if(screen){
    try{
      const vt=V.createVideoTexture('screen.mp4'); const el=(vt.source&&vt.source.element)||null;
      if(el){el.loop=true;el.muted=true;el.playsInline=true;el.setAttribute('playsinline','');el.play&&el.play().catch(()=>{});
        const kick=()=>{el.play&&el.play().catch(()=>{});window.removeEventListener('pointerdown',kick)};window.addEventListener('pointerdown',kick)}
      screen.emissiveTexture.setTexture(vt);
    }catch(err){console.warn('screen video unavailable',err)}
  }
  const lamp=byName('Lamp_Amber');
  if(lamp){let on=true;setInterval(()=>{on=!on;lamp.setEmissiveFactor(on?[1,0.28,0]:[0.08,0.02,0])},450)}
});
</script>
